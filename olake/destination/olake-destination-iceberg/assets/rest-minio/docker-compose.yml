# Local Iceberg destination for a POC: REST catalog + MinIO. Not for production.
# Start: docker compose up -d   Stop: docker compose down   Wipe data: docker compose down -v
# Run OLake with --network olake-poc and use the service names (iceberg-rest, minio) in destination.json.
# Host ports are only for you (MinIO console, curl); change them if taken: MINIO_PORT=19000 docker compose up -d
name: olake-poc

services:
  minio:
    image: olakego/minio:RELEASE.2025-04-03T14-56-28Z
    container_name: olake-minio
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      default:
        aliases:
          - warehouse.minio

  mc:
    image: olakego/mc:RELEASE.2025-04-03T17-07-56Z
    container_name: olake-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 admin password &&
      mc mb --ignore-existing minio/warehouse
      "
    restart: "no"

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: olake-iceberg-rest
    user: root # the catalog database lives in the catalog-data volume, owned by root
    depends_on:
      mc:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:file:/catalog/iceberg_catalog.db
    ports:
      - "${REST_PORT:-8181}:8181"
    volumes:
      - catalog-data:/catalog

volumes:
  minio-data:
  catalog-data:

networks:
  default:
    name: olake-poc
